<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clique dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #c9d1d9; margin: 0; padding: 1rem; }
  h1 { font-size: 1.1rem; } h2 { font-size: .95rem; color: #58a6ff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
          gap: 1rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: .8rem 1rem; }
  table { border-collapse: collapse; width: 100%; font-size: .8rem; }
  th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #21262d; }
  .badge { padding: 0 .4em; border-radius: 4px; font-size: .75rem; }
  .ready { background: #1f6f3f; } .busy { background: #9e6a03; }
  .offline { background: #6e1f1f; } .joining { background: #30363d; }
  .op { color: #d2a8ff; } .owner { color: #ffa657; }
  .sugg { border-left: 3px solid #d29922; padding-left: .6rem; margin: .4rem 0; }
  #events { max-height: 14rem; overflow-y: auto; font-size: .72rem; color: #8b949e; }
  #liveOut { max-height: 16rem; overflow-y: auto; font-size: .78rem;
             white-space: pre-wrap; word-break: break-word; }
  tr.live { cursor: pointer; } tr.live:hover td { background: #21262d; }
  tr.watching td { background: #1c2b1c; }
  .muted { color: #8b949e; }
</style>
</head>
<body>
<h1>clique <span id="cliqueName" class="muted"></span></h1>
<div class="grid">
  <div class="card"><h2>Devices</h2><div id="nodes"></div></div>
  <div class="card"><h2>Queue</h2><div id="tasks"></div>
    <span class="muted">click a running task to watch its live output</span></div>
  <div class="card" style="grid-column: 1 / -1"><h2>Live output
    <span id="liveTask" class="muted"></span></h2>
    <div id="liveOut"><span class="muted">no task watched</span></div></div>
  <div class="card"><h2>Sessions</h2><div id="sessions"></div></div>
  <div class="card"><h2>Suggestions</h2><div id="suggestions"></div></div>
  <div class="card"><h2>Live workspaces</h2><div id="workspaces"></div></div>
  <div class="card"><h2>Snapshots</h2><div id="vcs"></div></div>
  <div class="card" style="grid-column: 1 / -1"><h2>Live events</h2>
    <div id="events"></div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const j = async (p) => (await fetch(p)).json();

function badge(s) { return `<span class="badge ${s}">${s}</span>`; }

async function refresh() {
  try {
    const [clique, nodes, tasks, sessions, suggestions, vcs, clusters, workspaces] =
      await Promise.all([
        j('/v1/clique'), j('/v1/nodes'), j('/v1/tasks'), j('/v1/sessions'),
        j('/v1/suggestions'),
        j('/v1/vcs/history?limit=10'), j('/v1/clusters'), j('/v1/workspaces')]);
    const clusterKeys = (clusters || []).map(c =>
      `${c.cluster_key}×${(c.node_ids || []).length}`).join(' · ')
      || 'no clusters';
    $('cliqueName').textContent =
      `· ${clique.name} · ${clusterKeys}`;
    $('nodes').innerHTML = '<table><tr><th>name</th><th>status</th>'
      + '<th>cluster</th><th>task</th></tr>'
      + nodes.map(n => `<tr><td>${n.display_name}</td><td>${badge(n.status)}</td>`
        + `<td>${n.model ? n.model.family + '-' + n.model.parameter_count_b + 'b' : '-'}</td>`
        + `<td>${n.current_task_id ? n.current_task_id.slice(0,10) : '-'}</td></tr>`)
        .join('') + '</table>';
    $('tasks').innerHTML = '<table><tr><th>id</th><th>state</th><th>node</th>'
      + '<th>type</th></tr>'
      + tasks.slice(0, 12).map((t) => {
        const id = t.request.task_id;
        const clickable = (t.state === 'assigned' || t.state === 'running')
          ? ` class="live${id === watching ? ' watching' : ''}" data-task="${id}"` : '';
        return `<tr${clickable}><td>${id.slice(0, 10)}</td>`
          + `<td>${t.state}</td><td>${t.assigned_node ? t.assigned_node.slice(0, 8) : '-'}</td>`
          + `<td>${t.request.task_type}</td></tr>`;
      }).join('') + '</table>';
    document.querySelectorAll('tr.live').forEach((tr) => {
      tr.onclick = () => watchTask(tr.dataset.task);
    });
    if (watching && !tasks.some((t) => t.request.task_id === watching)) {
      stopWatch(' (done)');
    }
    $('sessions').innerHTML = sessions.length
      ? '<table><tr><th>id</th><th>cluster</th><th>pinned</th><th>v</th></tr>'
        + sessions.map(s => `<tr><td>${s.session_id}</td><td>${s.cluster_key || '-'}</td>`
          + `<td>${s.pinned_node ? s.pinned_node.slice(0,8) : '-'}</td>`
          + `<td>${s.context_version}</td></tr>`).join('') + '</table>'
      : '<span class="muted">none active</span>';
    $('suggestions').innerHTML = suggestions.length
      ? suggestions.map(s => `<div class="sugg">${s.rationale}<br>`
        + `<span class="muted">${s.expected_effect}</span></div>`).join('')
      : '<span class="muted">none</span>';
    $('vcs').innerHTML = '<table>'
      + vcs.map(c => `<tr><td>${c.sha.slice(0,10)}</td><td>${c.message}</td>`
        + `<td class="muted">${c.actor}</td></tr>`).join('') + '</table>';
    $('workspaces').innerHTML = workspaces.length
      ? '<table><tr><th>id</th><th>seq</th></tr>'
        + workspaces.map(w => `<tr><td>${w.workspace_id}</td>`
          + `<td>${w.seq}</td></tr>`).join('') + '</table>'
      : '<span class="muted">none active</span>';
  } catch (e) { console.error(e); }
}

let watching = null;
let watchWs = null;

function showLive(text) {
  $('liveOut').textContent = text;
}

async function watchTask(taskId) {
  stopWatch();
  watching = taskId;
  $('liveTask').textContent = `· watching ${taskId.slice(0, 10)}`;
  showLive('connecting...');
  try {
    const cur = await j(`/v1/tasks/${taskId}`);
    showLive(cur.partial_output
      || (cur.result && cur.result.output) || '(no output yet)');
  } catch (e) { showLive(`(fetch failed: ${e})`); return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/tasks/${taskId}`);
  watchWs = ws;
  ws.onmessage = async () => {
    try {
      const now = await j(`/v1/tasks/${taskId}`);
      showLive(now.partial_output
        || (now.result && now.result.output) || $('liveOut').textContent);
    } catch (e) { /* keep last text on transient failure */ }
  };
  ws.onclose = () => {
    if (watchWs !== ws) return;
    $('liveTask').textContent += ' (done)';
    watchWs = null;
  };
}

function stopWatch(suffix = '') {
  if (watchWs) { const ws = watchWs; watchWs = null; ws.close(); }
  if (suffix && watching) $('liveTask').textContent += suffix;
  watching = null;
}

function connectEvents() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/events`);
  ws.onmessage = (m) => {
    const { event, payload } = JSON.parse(m.data);
    if (event === 'stats.tick') return;
    const div = document.createElement('div');
    div.textContent = `${new Date().toLocaleTimeString()} ${event} ${JSON.stringify(payload)}`;
    $('events').prepend(div);
    while ($('events').children.length > 100) $('events').lastChild.remove();
    refresh();
  };
  ws.onclose = () => setTimeout(connectEvents, 2000);
}

refresh();
setInterval(refresh, 5000);
connectEvents();
</script>
</body>
</html>
