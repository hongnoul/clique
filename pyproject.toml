[project]
name = "clique"
version = "0.0.1"
description = "Locally shared AI models over LAN: every node is a dev environment and a model provider (spec-only scaffold)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "httpx",
    "websockets",
    "zeroconf",
    "psutil",
    "huggingface_hub",
    "dulwich",
    "apscheduler",
    "typer",
    "rich",
    "textual",
    "pynacl",
    "certifi",
    "pytest",  # harness runtime dep: server verifies code tasks with pytest -q
    "mcp>=2",  # clique-mcp: MCP stdio server wrapping the SDK
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
clique = "client.cli:main"
clique-agent = "node.agent:main"
clique-server = "scheduler.server:main"
clique-mcp = "client.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# flat multi-package layout: list packages explicitly, exclude tests
packages = [
    "common",
    "node",
    "scheduler",
    "scheduler.api",
    "client",
]
[tool.uv]
# managed with uv for fast iteration
